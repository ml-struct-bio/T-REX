[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trex-binder-design"
version = "0.1.2"
description = "Evidence-guided adaptive allocation across de novo protein-binder design pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Minkyu Jeon"},
  {name = "Jinyeop Song"},
  {name = "Jeff Gore"},
  {name = "Ellen D. Zhong"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.80",
  "openai>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
assets = ["gdown==6.4.0"]
providers = [
  "anthropic>=0.40",
  "google-genai>=1.0",
]
dev = [
  "pytest>=8.0",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/ml-struct-bio/T-REX"
Repository = "https://github.com/ml-struct-bio/T-REX"
Issues = "https://github.com/ml-struct-bio/T-REX/issues"


[project.scripts]
trex = "trex.cli:main"
trex-controller = "trex.controller:main"
trex-provenance = "trex.provenance:main"
trex-export = "trex.export_best_n:main"
trex-analyze = "trex.analysis:main"
trex-validate = "trex.validation:main"
trex-panel = "trex.finalize_panel:main"
trex-target = "trex.targets:main"
trex-backend = "trex.scaffold:main"

# Include only declared runtime resources in wheels; retain tests in the sdist.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["trex*"]
exclude = ["trex.tests", "trex.tests.*"]


[tool.setuptools.package-data]
trex = [
  "data/config/reproducibility/*.json",
  "data/config/targets/*.json",
  "data/config/trex/*.json",
  "data/config/trex/*.txt",
  "data/docs/*.txt",
  "data/external/patches/*.patch",
]

[tool.pytest.ini_options]
testpaths = ["trex/tests"]
addopts = "-ra"
